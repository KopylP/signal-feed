name: build-test-deploy

# Every push to main that changes code is built, tested, deployed and released (tag + GitHub Release).
# A manual run with a tag redeploys that earlier release (rollback) and creates no new release.
on:
  push:
    branches: [main]
    # Changes that cannot affect the deployed code do not deploy or release.
    # prompts/*.md are NOT listed: they ship with the build.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "**/CLAUDE.md"
      - ".claude/**"
      - "infra/**"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to redeploy (rollback), e.g. v2026.11.24.137. Empty: deploy the current main."
        type: string
        default: ""

permissions:
  id-token: write # required to sign in to Azure via OIDC
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  PACKAGE_PATH: ./publish

jobs:
  build-test:
    runs-on: ubuntu-latest
    # contents: write lets the formatting step push its fix to a pull request branch.
    permissions:
      contents: write
    env:
      # Only a pull request from this repository can be fixed: forks and Dependabot get a read-only token.
      CAN_PUSH_FIX: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      pending: ${{ steps.version.outputs.pending }}
    steps:
      # An empty ref means the default checkout; with a tag it rebuilds that release;
      # a pull request from this repository is checked out on its branch so that a formatting fix can be pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || (env.CAN_PUSH_FIX == 'true' && github.head_ref) || '' }}
          # A push needs history to see which changelog section it added. The condition is written so that
          # the 0 comes last: in an expression `cond && 0 || 1` is always 1, because 0 is falsy.
          fetch-depth: ${{ github.event_name != 'push' && 1 || 0 }}

      # Version = build date + the built-in run counter, which never resets and never repeats (see ADR-0005).
      # The tag adds the word of the changelog section this push added (ADR-0007): v2026.11.24.131-falcon.
      # It is calculated once here, the number is baked into the build, and the tag is reused for the release.
      # `pending` lists every changelog section still waiting for a version, so the release job renames exactly those.
      - name: Calculate version
        id: version
        env:
          ROLLBACK_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          WORD=""
          PENDING=""
          if [ -n "$ROLLBACK_TAG" ]; then
            [[ "$ROLLBACK_TAG" =~ ^v([0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+)(-[a-z]{3,20})?$ ]] || { echo "Invalid tag: $ROLLBACK_TAG"; exit 1; }
            VERSION="${BASH_REMATCH[1]}"
            TAG="$ROLLBACK_TAG"
          else
            VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }}"
            if [ "$EVENT_NAME" = "push" ]; then
              # A failed lookup must not block a deploy: warn and continue without a word.
              WORD="$(python3 .github/scripts/changelog.py word "$BEFORE" "$GITHUB_SHA")" || { echo "::warning::Could not read the changelog word"; WORD=""; }
              PENDING="$(python3 .github/scripts/changelog.py pending "$GITHUB_SHA")" || { echo "::warning::Could not list the waiting changelog words"; PENDING=""; }
              # No section in this push (an internal-only change): the oldest waiting one names the release, if any.
              [ -n "$WORD" ] || WORD="${PENDING##*,}"
            fi
            TAG="v$VERSION${WORD:+-$WORD}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, tag: $TAG, waiting changelog words: ${PENDING:-none}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore

      # The version lives in .terraform-version, shared with infra.yml and with local tools (tfenv, asdf).
      # Skipped on a manual run, which rebuilds an older tag that predates the Terraform checks.
      - name: Read the Terraform version
        id: terraform-version
        if: github.event_name != 'workflow_dispatch'
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        if: github.event_name != 'workflow_dispatch'
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}

      # Formatting follows .editorconfig (C#) and terraform fmt. A pull request from this repository gets the fix
      # committed to its branch by github-actions[bot] and the build continues on the fixed code. Everything else
      # (main, forks, Dependabot) only verifies. A manual run rebuilds an older tag that predates the check, so it skips both.
      - name: Fix formatting
        if: env.CAN_PUSH_FIX == 'true'
        run: |
          dotnet format --no-restore
          terraform -chdir=infra fmt -recursive
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "Apply dotnet format and terraform fmt"
          git push

      - name: Check formatting
        if: env.CAN_PUSH_FIX != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          dotnet format --verify-no-changes --no-restore
          terraform -chdir=infra fmt -check -recursive

      # Static checks only: no backend, no Azure sign-in, nothing here can change the infrastructure.
      - name: Validate Terraform
        if: github.event_name != 'workflow_dispatch'
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test --configuration Release --no-build

      - run: dotnet publish src/PostAgent.Functions --configuration Release --no-build --output ${{ env.PACKAGE_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: functions-package
          path: ${{ env.PACKAGE_PATH }}
          # The package has a hidden `.azurefunctions` directory, which upload-artifact v4 skips by default; the deploy fails without it.
          include-hidden-files: true

  deploy:
    needs: build-test
    # Deploy is off until the repository variable DEPLOY_ENABLED=true is set (Settings → Variables).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: functions-package
          path: ${{ env.PACKAGE_PATH }}

      # OIDC: no passwords in GitHub, only identifiers (see docs/developer-guide/ci-cd.md).
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PACKAGE_PATH }}
          sku: flexconsumption

  # A release exists only for code that was actually deployed from a push. Reruns and manual
  # redeploys (rollback) do not create one. An explicit `if` drops the implicit success() check,
  # so the deploy result is tested by hand.
  release:
    needs: [build-test, deploy]
    if: needs.deploy.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release; only this job gets write access
    steps:
      # The tip of main, not the built commit: the changelog is renamed there, and later merges may already be on top.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Create the release and name the changelog sections
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-test.outputs.tag }}
          VERSION: v${{ needs.build-test.outputs.version }}
          PENDING: ${{ needs.build-test.outputs.pending }}
        run: |
          # Only the sections that were waiting when this commit was built are renamed; a section merged later waits for its own release.
          python3 .github/scripts/changelog.py release CHANGELOG.md "$VERSION" "$PENDING" notes.md

          # A re-run of the same run produces the same tag: keep the existing release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
          elif [ -s notes.md ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

          # CHANGELOG.md is in paths-ignore, and a push with GITHUB_TOKEN starts no workflow, so this cannot loop.
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "Name the changelog sections of $TAG"
            for attempt in 1 2 3; do
              git push origin HEAD:main && exit 0
              git pull --rebase origin main
            done
            echo "Could not push the changelog update to main"
            exit 1
          fi
