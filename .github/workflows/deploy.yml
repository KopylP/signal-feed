name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write # потрібно для входу в Azure через OIDC
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  PACKAGE_PATH: ./publish

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build

      - run: dotnet publish src/PostAgent.Functions --configuration Release --no-build --output ${{ env.PACKAGE_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: functions-package
          path: ${{ env.PACKAGE_PATH }}

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: functions-package
          path: ${{ env.PACKAGE_PATH }}

      # OIDC: жодних паролів у GitHub, лише ідентифікатори (див. README).
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PACKAGE_PATH }}
          sku: flexconsumption
