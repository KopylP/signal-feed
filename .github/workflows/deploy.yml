name: build-test-deploy

# Every push to main that changes code is built, tested, deployed and released (tag + GitHub Release).
# A manual run with a tag redeploys that earlier release (rollback) and creates no new release.
on:
  push:
    branches: [main]
    # Changes that cannot affect the deployed code do not deploy or release.
    # prompts/*.md are NOT listed: they ship with the build.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/CLAUDE.md"
      - ".claude/**"
      - "infra/**"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to redeploy (rollback), e.g. v2026.11.24.137. Empty: deploy the current main."
        type: string
        default: ""

permissions:
  id-token: write # required to sign in to Azure via OIDC
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  PACKAGE_PATH: ./publish

jobs:
  build-test:
    runs-on: ubuntu-latest
    # contents: write lets the formatting step push its fix to a pull request branch.
    permissions:
      contents: write
    env:
      # Only a pull request from this repository can be fixed: forks and Dependabot get a read-only token.
      CAN_PUSH_FIX: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # An empty ref means the default checkout; with a tag it rebuilds that release;
      # a pull request from this repository is checked out on its branch so that a formatting fix can be pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || (env.CAN_PUSH_FIX == 'true' && github.head_ref) || '' }}

      # Version = build date + the built-in run counter, which never resets and never repeats (see ADR-0005).
      # It is calculated once here, baked into the build, and reused for the release tag.
      - name: Calculate version
        id: version
        env:
          ROLLBACK_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$ROLLBACK_TAG" ]; then
            [[ "$ROLLBACK_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo "Invalid tag: $ROLLBACK_TAG"; exit 1; }
            VERSION="${ROLLBACK_TAG#v}"
          else
            VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore

      # The version lives in .terraform-version, shared with infra.yml and with local tools (tfenv, asdf).
      # Skipped on a manual run, which rebuilds an older tag that predates the Terraform checks.
      - name: Read the Terraform version
        id: terraform-version
        if: github.event_name != 'workflow_dispatch'
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        if: github.event_name != 'workflow_dispatch'
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}

      # Formatting follows .editorconfig (C#) and terraform fmt. A pull request from this repository gets the fix
      # committed to its branch by github-actions[bot] and the build continues on the fixed code. Everything else
      # (main, forks, Dependabot) only verifies. A manual run rebuilds an older tag that predates the check, so it skips both.
      - name: Fix formatting
        if: env.CAN_PUSH_FIX == 'true'
        run: |
          dotnet format --no-restore
          terraform -chdir=infra fmt -recursive
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "Apply dotnet format and terraform fmt"
          git push

      - name: Check formatting
        if: env.CAN_PUSH_FIX != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          dotnet format --verify-no-changes --no-restore
          terraform -chdir=infra fmt -check -recursive

      # Static checks only: no backend, no Azure sign-in, nothing here can change the infrastructure.
      - name: Validate Terraform
        if: github.event_name != 'workflow_dispatch'
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test --configuration Release --no-build

      - run: dotnet publish src/PostAgent.Functions --configuration Release --no-build --output ${{ env.PACKAGE_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: functions-package
          path: ${{ env.PACKAGE_PATH }}

  deploy:
    needs: build-test
    # Deploy is off until the repository variable DEPLOY_ENABLED=true is set (Settings → Variables).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: functions-package
          path: ${{ env.PACKAGE_PATH }}

      # OIDC: no passwords in GitHub, only identifiers (see docs/developer-guide/ci-cd.md).
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PACKAGE_PATH }}
          sku: flexconsumption

  # A release exists only for code that was actually deployed from a push. Reruns and manual
  # redeploys (rollback) do not create one. An explicit `if` drops the implicit success() check,
  # so the deploy result is tested by hand.
  release:
    needs: [build-test, deploy]
    if: needs.deploy.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release; only this job gets write access
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build-test.outputs.version }}
        run: |
          # A re-run of the same run produces the same tag: keep the existing release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
