name: infra

# Ручний запуск: створює або оновлює інфраструктуру за кодом у infra/.
# Без галочки apply виконується лише plan (показує, що зміниться, нічого не чіпає).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Застосувати зміни (terraform apply). Вимкнено: лише plan."
        type: boolean
        default: false

permissions:
  id-token: write # вхід в Azure через OIDC
  contents: read

concurrency:
  group: infra # state не можна змінювати одночасно
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Провайдер azurerm і backend заходять в Azure через OIDC, без паролів.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  # Змінні Terraform (infra/variables.tf). Несекретні, тому живуть у GitHub Variables.
  TF_VAR_location: ${{ vars.TF_LOCATION || 'westeurope' }}
  TF_VAR_name_prefix: ${{ vars.TF_NAME_PREFIX || 'signalfeed' }}
  TF_VAR_deployer_object_id: ${{ vars.TF_DEPLOYER_OBJECT_ID }}
  TF_VAR_budget_alert_email: ${{ vars.TF_BUDGET_ALERT_EMAIL }}
  TF_VAR_sources: ${{ vars.TF_SOURCES }}
  TF_VAR_alert_sources: ${{ vars.TF_ALERT_SOURCES }}
  TF_VAR_telegram_chat_id: ${{ vars.TF_TELEGRAM_CHAT_ID }}
  TF_VAR_telegram_api_id: ${{ vars.TF_TELEGRAM_API_ID }}
  TF_VAR_telegram_phone: ${{ vars.TF_TELEGRAM_PHONE }}
  # JSON-об'єкт, наприклад {"DigestSize":"6","AlertQuietHours":"23:00-07:00"}. Порожньо: усе за замовчуванням із коду.
  TF_VAR_app_settings: ${{ vars.TF_APP_SETTINGS || '{}' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # Віддалений state у Azure Storage (створюється один раз, див. README). Локально backend.tf не потрібен.
      - name: Налаштувати backend
        run: |
          cat > backend.tf <<'EOF'
          terraform {
            backend "azurerm" {
              use_oidc         = true
              use_azuread_auth = true
            }
          }
          EOF

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER || 'tfstate' }}" \
            -backend-config="key=signal-feed.tfstate"

      - run: terraform validate

      - name: terraform plan
        run: terraform plan -out=tfplan -detailed-exitcode || [ $? -eq 2 ]

      - name: Показати план у підсумку
        run: |
          {
            echo '### terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply
        if: inputs.apply
        run: terraform apply tfplan

      - name: Результат (значення для GitHub Variables і секретів)
        if: inputs.apply
        run: |
          {
            echo '### Outputs'
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
