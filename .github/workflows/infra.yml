name: infra

# Manual run: creates or updates the infrastructure defined in infra/.
# Without the apply checkbox only plan runs (shows what would change, touches nothing).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the changes (terraform apply). Off: plan only."
        type: boolean
        default: false

permissions:
  id-token: write # sign in to Azure via OIDC
  contents: read

concurrency:
  group: infra # the state must not be changed concurrently
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # The azurerm provider and the backend sign in to Azure via OIDC, no passwords.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  # Terraform variables (infra/variables.tf). Non-secret ones live in GitHub Variables. Personal data (email, phone, chat id)
  # lives in GitHub Secrets, because this repository is public and variable values are not masked in the logs.
  TF_VAR_location: ${{ vars.TF_LOCATION || 'westeurope' }}
  TF_VAR_name_prefix: ${{ vars.TF_NAME_PREFIX || 'signalfeed' }}
  TF_VAR_deployer_object_id: ${{ vars.TF_DEPLOYER_OBJECT_ID }}
  TF_VAR_budget_alert_email: ${{ secrets.TF_BUDGET_ALERT_EMAIL }}
  TF_VAR_alert_sources: ${{ vars.TF_ALERT_SOURCES }}
  TF_VAR_telegram_api_id: ${{ vars.TF_TELEGRAM_API_ID }}
  TF_VAR_telegram_phone: ${{ secrets.TF_TELEGRAM_PHONE }}
  # JSON object, e.g. {"DigestSize":"6","AlertQuietHours":"23:00-07:00"}. Empty: everything uses the defaults from code.
  TF_VAR_app_settings: ${{ vars.TF_APP_SETTINGS || '{}' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      # An empty TF_VAR_* would override the default in variables.tf, so pass only what is set.
      - name: Optional variables
        env:
          TF_SOURCES: ${{ vars.TF_SOURCES }}
          TF_TELEGRAM_CHAT_ID: ${{ secrets.TF_TELEGRAM_CHAT_ID }}
          TF_COLLECTOR_SCHEDULE: ${{ vars.TF_COLLECTOR_SCHEDULE }}
          TF_DIGEST_SCHEDULE: ${{ vars.TF_DIGEST_SCHEDULE }}
          TF_ALERT_SCHEDULE: ${{ vars.TF_ALERT_SCHEDULE }}
          TF_CLEANUP_SCHEDULE: ${{ vars.TF_CLEANUP_SCHEDULE }}
        run: |
          if [ -n "$TF_SOURCES" ]; then echo "TF_VAR_sources=$TF_SOURCES" >> "$GITHUB_ENV"; fi
          if [ -n "$TF_TELEGRAM_CHAT_ID" ]; then echo "TF_VAR_telegram_chat_id=$TF_TELEGRAM_CHAT_ID" >> "$GITHUB_ENV"; fi
          if [ -n "$TF_COLLECTOR_SCHEDULE" ]; then echo "TF_VAR_collector_schedule=$TF_COLLECTOR_SCHEDULE" >> "$GITHUB_ENV"; fi
          if [ -n "$TF_DIGEST_SCHEDULE" ]; then echo "TF_VAR_digest_schedule=$TF_DIGEST_SCHEDULE" >> "$GITHUB_ENV"; fi
          if [ -n "$TF_ALERT_SCHEDULE" ]; then echo "TF_VAR_alert_schedule=$TF_ALERT_SCHEDULE" >> "$GITHUB_ENV"; fi
          if [ -n "$TF_CLEANUP_SCHEDULE" ]; then echo "TF_VAR_cleanup_schedule=$TF_CLEANUP_SCHEDULE" >> "$GITHUB_ENV"; fi

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the Terraform version
        id: terraform-version
        working-directory: ${{ github.workspace }}
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}

      # Remote state in Azure Storage (created once, see docs/developer-guide/ci-cd.md). Locally backend.tf is not needed.
      - name: Configure backend
        run: |
          cat > backend.tf <<'EOF'
          terraform {
            backend "azurerm" {
              use_oidc         = true
              use_azuread_auth = true
            }
          }
          EOF

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER || 'tfstate' }}" \
            -backend-config="key=signal-feed.tfstate"

      - run: terraform validate

      - name: terraform plan
        run: terraform plan -out=tfplan -detailed-exitcode || [ $? -eq 2 ]

      - name: Show the plan in the summary
        run: |
          {
            echo '### terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply
        if: inputs.apply
        run: terraform apply tfplan

      - name: Outputs (values for GitHub Variables)
        if: inputs.apply
        run: |
          {
            echo '### Outputs'
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
